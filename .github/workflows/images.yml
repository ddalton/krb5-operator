# The images, for linux/amd64 and linux/arm64, each built on a runner of
# its own architecture (no emulation):
#
#   ghcr.io/ddalton/krb5-operator   this repo's Dockerfile
#   ghcr.io/ddalton/krb5-kdc        images/kdc
#
# A tag vX.Y.Z pushes both as X.Y.Z and latest; a pull request that
# touches them only builds them.
name: images

on:
  push:
    tags: ['v*']
  pull_request:
    paths: [Dockerfile, images/**, src/**, Cargo.*, .github/workflows/images.yml]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: krb5-operator, context: . }
          - { name: krb5-kdc, context: images/kdc }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build${{ env.PUSH == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: >-
            ${{ env.PUSH == 'true'
              && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.image.name)
              || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: record the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # One multi-arch tag per image from the two digests.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [krb5-operator, krb5-kdc]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag ${{ matrix.image }}
        working-directory: /tmp/digests
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          docker buildx imagetools create -t "$REPO:${VERSION#v}" -t "$REPO:latest" \
            $(printf "$REPO@sha256:%s " *)
          docker buildx imagetools inspect "$REPO:${VERSION#v}"
