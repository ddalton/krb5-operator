apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kerberosrealms.krb5.ddalton.dev
spec:
  group: krb5.ddalton.dev
  names:
    kind: KerberosRealm
    plural: kerberosrealms
    shortNames:
    - krealm
    singular: kerberosrealm
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.realm
      name: Realm
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.kdc
      name: KDC
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KerberosRealmSpec via `CustomResource`
        properties:
          spec:
            properties:
              allowedNamespaces:
                description: |-
                  Which namespaces' `KerberosPrincipal`s may use this realm (default:
                  only its own).
                nullable: true
                properties:
                  from:
                    default: Same
                    enum:
                    - Same
                    - All
                    - Selector
                    type: string
                  selector:
                    description: 'With `from: Selector`: the namespaces whose labels match.'
                    nullable: true
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                        items:
                          description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector applies to.
                              type: string
                            operator:
                              description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                type: object
              image:
                description: 'The KDC image (default: the operator''s MIT krb5 image).'
                nullable: true
                type: string
              maxRenewableLife:
                description: Maximum renewable lifetime (default `7d`).
                nullable: true
                type: string
              maxTicketLife:
                description: Maximum ticket lifetime (krb5 duration, default `10h`).
                nullable: true
                type: string
              realm:
                description: The realm name, by convention upper case (`EXAMPLE.COM`).
                type: string
              storage:
                description: Size of the volume holding the KDC database (default `1Gi`).
                nullable: true
                type: string
              storageClassName:
                description: 'Storage class for that volume (default: the cluster''s).'
                nullable: true
                type: string
            required:
            - realm
            type: object
          status:
            nullable: true
            properties:
              adminServer:
                description: '`host:port` of kadmind.'
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  description: A status condition (the Kubernetes convention).
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      description: '`True`, `False` or `Unknown`.'
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kdc:
                description: '`host:port` of the KDC inside the cluster.'
                nullable: true
                type: string
              krb5ConfConfigMap:
                description: The ConfigMap with a client `krb5.conf` for this realm.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: KerberosRealm
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kerberosprincipals.krb5.ddalton.dev
spec:
  group: krb5.ddalton.dev
  names:
    kind: KerberosPrincipal
    plural: kerberosprincipals
    shortNames:
    - kprinc
    singular: kerberosprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .spec.realmNamespace
      name: Realm Namespace
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.secretName
      name: Secret
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KerberosPrincipalSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Principals with random keys, created through kadmind, and a Secret
              holding their keytab.
            properties:
              deletionPolicy:
                default: Delete
                description: '`Delete` (default) or `Retain` the principals when this is deleted.'
                enum:
                - Delete
                - Retain
                type: string
              hostPrincipals:
                description: |-
                  Host principals for every pod of a StatefulSet, following its
                  replicas.
                nullable: true
                properties:
                  services:
                    description: Service names (`dn`, `HTTP`).
                    items:
                      type: string
                    type: array
                  statefulSet:
                    description: |-
                      The StatefulSet (this object's namespace); its `serviceName` gives
                      the pods their DNS names.
                    type: string
                required:
                - services
                - statefulSet
                type: object
              keytabKey:
                description: The key in that Secret (default `krb5.keytab`).
                nullable: true
                type: string
              principals:
                default: []
                description: |-
                  Principal names (`nn/host.example.com`): the realm is appended, or,
                  if given (`...@REALM`), must be the realm's.
                items:
                  type: string
                type: array
              realmNamespace:
                description: |-
                  Its namespace (default: this object's). The realm must allow this
                  object's namespace (`allowedNamespaces`).
                nullable: true
                type: string
              realmRef:
                description: The `KerberosRealm` the principals belong to.
                type: string
              secretName:
                description: 'The Secret to write the keytab to (default: this object''s name).'
                nullable: true
                type: string
            required:
            - realmRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: A status condition (the Kubernetes convention).
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      description: '`True`, `False` or `Unknown`.'
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              principals:
                default: []
                description: Each principal (with its realm) and its key version.
                items:
                  properties:
                    kvno:
                      format: uint32
                      minimum: 0.0
                      type: integer
                    name:
                      type: string
                    node:
                      description: The node a node principal is for.
                      nullable: true
                      type: string
                    pod:
                      description: The pod a host principal is for.
                      nullable: true
                      type: string
                  required:
                  - kvno
                  - name
                  type: object
                type: array
              secretName:
                description: The Secret holding the keytab.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: KerberosPrincipal
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kerberosnodekeytabs.krb5.ddalton.dev
spec:
  group: krb5.ddalton.dev
  names:
    kind: KerberosNodeKeytab
    plural: kerberosnodekeytabs
    shortNames:
    - knk
    singular: kerberosnodekeytab
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.realmRef
      name: Realm
      type: string
    - jsonPath: .status.nodes
      name: Nodes
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KerberosNodeKeytabSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Host keytabs for nodes: `<service>/<node hostname>` for each selected
              node, installed into the node's keytab (`/etc/krb5.keytab`) by a
              DaemonSet in the operator's namespace. What the kernel's NFS client
              (rpc.gssd) needs for `sec=krb5*` mounts.

              Cluster-scoped: it has the operator write files on nodes, which is for
              cluster administrators to ask for.
            properties:
              deletionPolicy:
                default: Delete
                description: '`Delete` (default) or `Retain` the principals when this is deleted.'
                enum:
                - Delete
                - Retain
                type: string
              domain:
                description: |-
                  Appended to a node hostname without a dot (`worker1` →
                  `worker1.example.com`); the name must be what the node calls itself.
                nullable: true
                type: string
              keytabPath:
                description: |-
                  The keytab on the node (default `/etc/krb5.keytab`). Entries of
                  other realms in it are kept.
                nullable: true
                type: string
              krb5ConfPath:
                description: |-
                  Also write a `krb5.conf` for the realm there (the KDC by its
                  Service's cluster IP: nodes do not resolve cluster DNS), e.g.
                  `/etc/krb5.conf.d/krb5-operator.conf`. Default: none.
                nullable: true
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  The nodes (labels they must have; default: every node whose taints
                  `tolerations` tolerate).
                nullable: true
                type: object
              realmNamespace:
                description: Its namespace.
                type: string
              realmRef:
                description: The `KerberosRealm` the principals belong to.
                type: string
              restartServices:
                description: |-
                  systemd services on the node to start, and to restart whenever the
                  agent writes the keytab or `krb5.conf`, e.g. `[rpc-gssd]`: nfs-utils'
                  unit does not run on a node that had no keytab when it booted.
                  Default: none. Setting it mounts the host's systemd socket
                  (`/run/systemd/private`) into the agent, which lets it start any
                  unit: the agent asks for these alone. Nodes must run systemd.
                items:
                  type: string
                type: array
              services:
                default:
                - host
                - nfs
                description: 'Service names (default `host`, `nfs`): `<service>/<node hostname>`.'
                items:
                  type: string
                type: array
              tolerations:
                description: Tolerations for the DaemonSet, and so for which nodes get keys.
                items:
                  description: The pod this Toleration is attached to tolerates any taint that matches the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: Effect indicates the taint effect to match. Empty means match all taint effects. When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: Key is the taint key that the toleration applies to. Empty means match all taint keys. If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: Operator represents a key's relationship to the value. Valid operators are Exists and Equal. Defaults to Equal. Exists is equivalent to wildcard for value, so that a pod can tolerate all taints of a particular category.
                      type: string
                    tolerationSeconds:
                      description: TolerationSeconds represents the period of time the toleration (which must be of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default, it is not set, which means tolerate the taint forever (do not evict). Zero and negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: Value is the taint value the toleration matches to. If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                nullable: true
                type: array
            required:
            - realmNamespace
            - realmRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: A status condition (the Kubernetes convention).
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      description: '`True`, `False` or `Unknown`.'
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodes:
                default: 0
                description: How many nodes have keys.
                format: uint32
                minimum: 0.0
                type: integer
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              principals:
                default: []
                items:
                  properties:
                    kvno:
                      format: uint32
                      minimum: 0.0
                      type: integer
                    name:
                      type: string
                    node:
                      description: The node a node principal is for.
                      nullable: true
                      type: string
                    pod:
                      description: The pod a host principal is for.
                      nullable: true
                      type: string
                  required:
                  - kvno
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        title: KerberosNodeKeytab
        type: object
    served: true
    storage: true
    subresources:
      status: {}
