{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [krb5.ddalton.dev]
    resources: [kerberosrealms, kerberosprincipals]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [krb5.ddalton.dev]
    resources: [kerberosrealms/status, kerberosprincipals/status, kerberosprincipals/finalizers]
    verbs: [get, patch, update]
  # Realms: the master key and admin password; principals: keytabs.
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krb5-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krb5-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
