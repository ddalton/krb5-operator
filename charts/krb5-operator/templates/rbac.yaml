{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [krb5.ddalton.dev]
    resources: [kerberosrealms, kerberosprincipals, kerberosnodekeytabs]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [krb5.ddalton.dev]
    resources:
      - kerberosrealms/status
      - kerberosprincipals/status
      - kerberosprincipals/finalizers
      - kerberosnodekeytabs/status
      - kerberosnodekeytabs/finalizers
    verbs: [get, patch, update]
  # Realms: the master key and admin password; principals: keytabs.
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, patch, update]
  # Realms' KDCs; KerberosNodeKeytabs' agents (in the operator's namespace).
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets]
    verbs: [get, list, watch, create, patch, update]
  # KerberosNodeKeytabs name nodes' principals after their hostnames.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # A realm's allowedNamespaces selector matches namespace labels.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krb5-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krb5-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# In its own namespace only: KerberosNodeKeytabs delete the Secret and
# DaemonSet of a node that no longer needs them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "krb5-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krb5-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "krb5-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "krb5-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
